name: actionable-hypotension
channels:
  - conda-forge
  - defaults

dependencies:
  # --- Python version ---
  - python=3.11

  # --- Jupyter for Notebooks ---
  - jupyterlab
  - ipywidgets

  # --- Core scientific stack ---
  - numpy=2.2.6
  - pandas=2.3.2
  - scipy=1.16.1
  - scikit-learn=1.7.1
  - matplotlib=3.10.5
  - plotly=6.3.0
  - joblib=1.5.1

  # --- Modeling & Explainability ---
  - shap=0.48.0
  - optuna=4.5.0
  
  - pip
  - pip:
      # packages only available via PyPI (not in conda-forge)
      - xgboost==3.0.4
      - deeproc==1.0.17
      - python-dotenv==1.1.1
      - SQLAlchemy==2.0.43
      - psycopg2-binary==2.9.10
