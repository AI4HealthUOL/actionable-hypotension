[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predicting-catecholamine-therapy-initiation"
version = "0.0.0"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["training*", "calibration*", "evaluation*", "baseline_model*", "models*", "utils*", "dataset_build*"]
