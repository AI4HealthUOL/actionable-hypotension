[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actionable-hypotension"
version = "0.0.1"
description = "Predicting catecholamine therapy initiation from ICU data"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["training*", "calibration*", "evaluation*", "baseline_model*", "models*", "utils*", "dataset_build*"]